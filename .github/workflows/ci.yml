name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: working-time-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: working_time_${{ github.run_id }}_quality
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose -f ci/compose.yaml run --build --rm quality
      - if: always()
        run: docker compose -f ci/compose.yaml down --volumes --remove-orphans

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      COMPOSE_PROJECT_NAME: working_time_${{ github.run_id }}_integration
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose -f ci/compose.yaml run --build --rm integration
      - if: always()
        run: docker compose -f ci/compose.yaml down --volumes --remove-orphans
